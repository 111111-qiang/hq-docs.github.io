site_name: 嵌入式研发文档

site_url: https://1111111-qiang.github.io/hq-docs.github.io/


theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
